[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pku-radar"
version = "0.1.0"
description = "PKU Radar offline fixture lifecycle"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "tzdata; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["pku_radar*"]
